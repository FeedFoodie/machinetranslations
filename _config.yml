  enabled: true
  per_page: 20
  limit: 0
  sort_field: 'date'
  sort_reverse: true


# Build settings
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate-v2
