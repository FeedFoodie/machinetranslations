title: Banana Translations
# tagline: Read free English fan translations of novels like Absolute Regression. No ads, no paywalls. Updated regularly.
baseurl: "" # the subpath of your site, e.g. /blog
repository: FeedFoodie/machinetranslations
url: "https://mtl.northbladetl.com" # the base hostname & protocol for your site, e.g. http://example.com
markdown: kramdown
markdown_ext: md
kramdown:  
  parse_block_html: true
  smart_quotes: ["apos", "apos", "quot", "quot"]
